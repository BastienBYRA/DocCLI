name: Release Build

on:
  push:
    branches:
      - build/init-github-action

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build Binary
        run: |
          pyinstaller --onefile ./doccli/doccli/main.py

      - name: Rename Binaries
        run: |
          mkdir artifacts
          if [[ "$RUNNER_OS" == "Linux" ]]; then mv dist/main artifacts/main-linux; fi
          if [[ "$RUNNER_OS" == "macOS" ]]; then mv dist/main artifacts/main-macos; fi
        shell: bash

      - name: Rename Windows Binary
        if: runner.os == 'Windows'
        run: |
          mkdir artifacts
          move dist\main.exe artifacts\main-windows.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}
          path: artifacts/

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          body: "Automated release generated by GitHub Actions."
          draft: false
          prerelease: false
          files: |
            artifacts/binary-ubuntu-latest/main-linux
            artifacts/binary-macos-latest/main-macos
            artifacts/binary-windows-latest/main-windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
