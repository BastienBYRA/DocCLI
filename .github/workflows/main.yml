name: Release Build

on:
  push:
    branches:
      - release
      - build/init-github-action

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version-file: "doccli/pyproject.toml"

      - name: Install Dependencies
        run: |
          cd doccli
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller

      - name: Check Installed Dependencies
        run: |
          cd doccli
          pip list

      - name: Build Binary
        run: |
          cd doccli
          pyinstaller --onefile ./doccli/main.py

      - name: Rename Binaries
        run: |
          cd doccli
          mkdir artifacts
          if [[ "$RUNNER_OS" == "Linux" ]]; then mv dist/main artifacts/main-linux; fi
          if [[ "$RUNNER_OS" == "macOS" ]]; then mv dist/main artifacts/main-macos; fi
        shell: bash

      - name: Rename Windows Binary
        if: runner.os == 'Windows'
        run: |
          cd doccli
          if (Test-Path artifacts) { Remove-Item -Recurse -Force artifacts }
          mkdir artifacts
          move dist\main.exe artifacts\main-windows.exe
        shell: pwsh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}
          path: doccli/artifacts/

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract version from pyproject.toml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' ./doccli/pyproject.toml)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
        shell: bash

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          body: "Automated release generated by GitHub Actions."
          draft: false
          prerelease: false
          files: |
            artifacts/binary-ubuntu-latest/main-linux
            artifacts/binary-macos-latest/main-macos
            artifacts/binary-windows-latest/main-windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
