[project]
name = "doccli"
version = "0.1.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "annotated-types>=0.7.0",
    "click>=8.1.8",
    "fastapi[standard]>=0.115.6",
    "gitpython>=3.1.43",
    "loguru>=0.7.3",
    "mypy>=1.12.1",
    "pandas-stubs>=2.2.3.241009",
    "pandas>=2.2.3",
    "pick>=2.4.0",
    "pydantic>=2.9.2",
    "pyinstaller>=6.11.1",
    "pypdf>=5.0.1",
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
    "setuptools>=75.6.0",
    "spire-doc>=12.7.1",
    "typer>=0.15.1",
    "types-requests>=2.32.0.20241016",
    "uvicorn>=0.34.0",
    "validators>=0.34.0",
]

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"
